<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scripts</title>

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f5;
    color: #18181b;
}

header {
    background: white;
    border-bottom: 1px solid #e4e4e7;
    padding: 20px 30px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-container {
    max-width: 1000px;
    margin: auto;
}

.logo {
    font-size: 21px;
    font-weight: 700;
}

main {
    max-width: 1000px;
    margin: 35px auto;
    padding: 0 20px 50px;
}

.intro {
    margin-bottom: 25px;
}

.intro h1 {
    margin:0 0 6px;
    font-size: 28px;
}

.intro p {
    margin: 0;
    color: #71717a;
    font-size: 14px;
}

.script-card {
    background: white;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.script-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.script-title {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 18px;
    font-weight: 700;
    color: #18181b;
    padding: 6px 3px;
}

.script-title:focus {
    background: #fafafa;
    border-radius: 5px;
}

.script-actions {
    display: flex;
    gap: 7px;
}

.copy-btn,
.clear-btn,
.delete-btn {
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.copy-btn {
    background: #18181b;
    color: white;
}

.copy-btn:hover {
    background: #3f3f46;
}

.clear-btn {
    background: #f4f4f5;
    color: #18181b;
}

.clear-btn:hover {
    background: #e4e4e7;
}

.delete-btn {
    background: transparent;
    color: #a1a1aa;
    font-size: 17px;
    padding: 6px 8px;
}

.delete-btn:hover {
    background: #f4f4f5;
    color: #dc2626;
}

.script-text {
    width: 100%;
    min-height: 250px;
    resize: vertical;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    padding: 15px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: #18181b;
    background: white;
    outline: none;
}

.script-text:focus {
    border-color: #a1a1aa;
}

.script-text::placeholder {
    color: #a1a1aa;
}

.add-script-btn {
    width: 100%;
    padding: 15px;
    background: white;
    border: 2px dashed #d4d4d8;
    border-radius: 10px;
    color: #52525b;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.add-script-btn:hover {
    background: #fafafa;
    border-color: #a1a1aa;
    color: #18181b;
}

.notification {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(20px);
    background: #18181b;
    color: white;
    padding: 11px 18px;
    border-radius: 7px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s ease;
    z-index: 100;
}

.notification.show {
    opacity: 1;
    transform:translateX(-50%) translateY(0);
}

@media (max-width: 650px) {

    header {
        padding: 17px;
    }

    main {
        margin-top: 25px;
        padding: 0 12px 40px;
    }

    .intro h1 {
        font-size: 24px;
    }

    .script-card {
        padding: 14px;
    }

    .script-header {
        align-items: flex-start;
    }

    .script-actions {
        flex-wrap: wrap;
    }

    .copy-btn,
    .clear-btn {
        padding: 7px 10px;
    }

    .script-text {
        min-height: 200px;
    }
}
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <div class="logo">
                TCAI Rickmer - Scripts
            </div>
        </div>
    </header>

    <main>

        <div class="intro">
            <h1>My Scripts</h1>

            <p>
                Create, organize, copy and paste your scripts Rickmer.
            </p>
        </div>

        <div id="scriptsContainer">

            <div class="script-card">

                <div class="script-header">

                    <input
                        type="text"
                        class="script-title"
                        value="Scene 1"
                        placeholder="Script title"
                    >

                    <div class="script-actions">

                        <button class="copy-btn">
                            Copy
                        </button>

                        <button class="clear-btn">
                            Clear
                        </button>

                        <button
                            class="delete-btn"
                            title="Delete script"
                        >
                            ✕
                        </button>

                    </div>

                </div>

                <textarea
                    class="script-text"
                    placeholder="Paste or type your script here..."
                ></textarea>

            </div>

        </div>

        <button
            id="addScriptBtn"
            class="add-script-btn"
        >
            + Add New Script
        </button>

    </main>

    <div
        id="notification"
        class="notification"
    >
        Script copied!
    </div>

     <script>
        const scriptsContainer =
    document.getElementById("scriptsContainer");

const addScriptBtn =
    document.getElementById("addScriptBtn");

const notification =
    document.getElementById("notification");

function addScript() {

    const scriptNumber =
        scriptsContainer.querySelectorAll(
            ".script-card"
        ).length + 1;


    const card =
        document.createElement("div");

    card.className =
        "script-card";


    card.innerHTML = `

        <div class="script-header">

            <input
                type="text"
                class="script-title"
                value="Scene ${scriptNumber}"
                placeholder="Script title"
            >

            <div class="script-actions">

                <button class="copy-btn">
                    Copy
                </button>

                <button class="clear-btn">
                    Clear
                </button>

                <button
                    class="delete-btn"
                    title="Delete script"
                >
                    ✕
                </button>

            </div>

        </div>


        <textarea
            class="script-text"
            placeholder="Paste or type your script here..."
        ></textarea>

    `;


    scriptsContainer.appendChild(card);


    attachEvents(card);

    saveScripts();

    card
        .querySelector(".script-text")
        .focus();

    card.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function copyScript(card) {

    const text =
        card
            .querySelector(".script-text")
            .value
            .trim();


    if (!text) {

        showNotification(
            "Nothing to copy!"
        );

        return;
    }


    navigator.clipboard
        .writeText(text)

        .then(() => {

            showNotification(
                "Script copied!"
            );

        })

        .catch(() => {

            const temporary =
                document.createElement(
                    "textarea"
                );

            temporary.value =
                text;

            document.body.appendChild(
                temporary
            );

            temporary.select();

            document.execCommand(
                "copy"
            );

            temporary.remove();


            showNotification(
                "Script copied!"
            );
        });
}

function clearScript(card) {

    const textBox =
        card.querySelector(".script-text");

    if (!textBox.value.trim()) {
        showNotification("Nothing to clear!");
        return;
    }

    const confirmed =
        confirm("Are you sure you want to clear this script?");

    if (!confirmed) return;

    textBox.value = "";

    saveScripts();

    showNotification("Script cleared!");
}

function deleteScript(card) {

    const scripts =
        scriptsContainer.querySelectorAll(
            ".script-card"
        );

    if (scripts.length === 1) {

        const confirmed =
            confirm(
                "This is your only script. Clear it instead?"
            );

        if (confirmed) {

            scripts[0]
                .querySelector(".script-text")
                .value = "";

            saveScripts();

            showNotification(
                "Script cleared!"
            );
        }

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this script?"
        );


    if (!confirmed) return;


    card.remove();


    saveScripts();
}

function attachEvents(card) {

    const copyButton =
        card.querySelector(".copy-btn");

    const clearButton =
        card.querySelector(".clear-btn");

    const deleteButton =
        card.querySelector(".delete-btn");

    const title =
        card.querySelector(".script-title");

    const textarea =
        card.querySelector(".script-text");

    copyButton.addEventListener(
        "click",
        () => copyScript(card)
    );

    clearButton.addEventListener(
        "click",
        () => clearScript(card)
    );

    deleteButton.addEventListener(
        "click",
        () => deleteScript(card)
    );

    title.addEventListener(
        "input",
        saveScripts
    );

    textarea.addEventListener(
        "input",
        saveScripts
    );
}

function saveScripts() {

    const cards =
        scriptsContainer.querySelectorAll(
            ".script-card"
        );

    const scripts = [];

    cards.forEach(card => {

        const title =
            card
                .querySelector(".script-title")
                .value;

        const text =
            card
                .querySelector(".script-text")
                .value;

        scripts.push({
            title: title,
            text: text
        });

    });


    localStorage.setItem(
        "aiVideoScripts",
        JSON.stringify(scripts)
    );
}

function loadScripts() {

    const saved =
        localStorage.getItem(
            "aiVideoScripts"
        );

    if (!saved) {

        const firstCard =
            scriptsContainer
                .querySelector(".script-card");

        attachEvents(firstCard);

        return;
    }


    try {

        const scripts =
            JSON.parse(saved);


        scriptsContainer.innerHTML = "";


        scripts.forEach(
            (script, index) => {

                createScript(
                    script.title ||
                    `Script ${index + 1}`,

                    script.text ||
                    ""
                );

            }
        );

        if (scripts.length === 0) {

            createScript(
                "Script 1",
                ""
            );
        }

    } catch (error) {

        console.log(
            "Unable to load saved scripts."
        );
    }
}


function createScript(
    title,
    text
) {

    const card =
        document.createElement("div");

    card.className =
        "script-card";


    card.innerHTML = `

        <div class="script-header">

            <input
                type="text"
                class="script-title"
                placeholder="Script title"
            >

            <div class="script-actions">

                <button class="copy-btn">
                    Copy
                </button>

                <button class="clear-btn">
                    Clear
                </button>

                <button
                    class="delete-btn"
                    title="Delete script"
                >
                    ✕
                </button>

            </div>

        </div>


        <textarea
            class="script-text"
            placeholder="Paste or type your script here..."
        ></textarea>

    `;


    card
        .querySelector(".script-title")
        .value = title;


    card
        .querySelector(".script-text")
        .value = text;


    scriptsContainer.appendChild(
        card
    );


    attachEvents(card);
}

function showNotification(message) {

    notification.textContent =
        message;


    notification.classList.add(
        "show"
    );


    setTimeout(() => {

        notification.classList.remove(
            "show"
        );

    }, 1800);
}

addScriptBtn.addEventListener(
    "click",
    addScript
);

loadScripts();
     </script>

</body>

</html>
